name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  barcode_widget: ^2.0.4
  crypto: 3.0.6
  device_info_plus: ^10.1.0      # <--- إضافة مكتبة معرف الأجهزة
  fl_chart: ^0.68.0
  flutter_secure_storage: ^9.0.0 # <--- إضافة التشفير المحلي
  google_fonts: ^6.2.1
  intl_phone_field: ^3.2.0
  mobile_scanner: ^5.2.3         # <--- إضافة مكتبة الكاميرا وقارئ الباركود
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.3.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21